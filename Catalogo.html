<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="Cards.css">
    <link rel="stylesheet" href="darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="lightmode">
    <header>
        <a href="index.html" class="logo-link">
            <img src="LogoValOro.png" alt="Logo Val'Oro" id="logo">
        </a>
        <nav class="main-nav">
            <ul class="main-menu">
                <li class="menu-item"><a href="index.html" class="menu-btn" id="inicio-btn">Inicio</a></li>
                <li class="menu-item"><a href="Catalogo.html" class="menu-btn" id="catalogo-btn">Catálogo</a></li>
                <li class="menu-item"><a href="Contactanos.html" class="menu-btn" id="contactanos-btn">Contáctanos</a></li>
                <li class="menu-item"><a href="nosotros.html" class="menu-btn" id="nosotros-btn">Nosotros</a></li>
            </ul>
        </nav>
        <button class="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <main id="main-content">
        <div class="header-content">
            <h1>Nuestro Catálogo Digital</h1>
            <p>Descubre nuestras opciones personalizadas para capturar tus momentos especiales.</p>
        </div>

        <div class="gallery">
            <div class="pdf-container">
                <iframe src="https://drive.google.com/file/d/1YcM1TiGAGFi-H85ET81V0yWPinoZ2hPN/preview"
                        width="100%" height="600px"></iframe>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 Hecho por Graduaciones Val'Oro, empresa 100% Hidalguense.</p>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
    <script src="main.js"></script>
    <script>
        const hamburger = document.querySelector('.hamburger');
        const mainNav = document.querySelector('.main-nav');

        hamburger.addEventListener('click', () => {
            mainNav.classList.toggle('open');
            hamburger.classList.toggle('open');
        });
    </script>
</body>
</html>
